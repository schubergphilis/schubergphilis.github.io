<!-- Menu -->
  <nav id="menu">
    <h2>Menu</h2>
    <ul>
        <li><a href="/index.html">Home</a></li>
        <!-- categories -->
      {% assign items = (site.categories | sort: "order") %}
      {% for item in items %}
        <li><a href="{{ item.url }}">{{ item.title }}</a></li>
      {% endfor %}
        <!-- _data/menu.yml -->
      {% for item in site.data.menu %}
        <li><a href="{{ item.url }}">{{ item.name }}</a></li>
      {% endfor %}
    </ul>
  </nav>
